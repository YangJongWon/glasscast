<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>GlassCast</title>
<style>
  :root {
    --bg: #f4f4f5;
    --fg: #18181b;
    --muted: #71717a;
    --panel: rgba(255, 255, 255, 0.86);
    --border: rgba(0, 0, 0, 0.08);
    --accent: #2563eb;
    --live: #dc2626;
    --ok: #16a34a;
    --warn: #d97706;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #09090b;
      --fg: #fafafa;
      --muted: #a1a1aa;
      --panel: rgba(24, 24, 27, 0.82);
      --border: rgba(255, 255, 255, 0.1);
      --accent: #60a5fa;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--fg);
    font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    overflow: hidden;
  }
  body.clean { background: #000; }

  #stage {
    position: fixed;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  #video {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    display: block;
  }
  #placeholder {
    position: absolute;
    text-align: center;
    color: var(--muted);
    padding: 16px;
  }
  #placeholder strong { display: block; color: var(--fg); font-size: 18px; margin-bottom: 4px; }

  .bar {
    position: fixed;
    left: 16px;
    right: 16px;
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
    padding: 8px 12px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    transition: opacity 0.3s;
  }
  #top { top: 16px; }
  #bottom { bottom: 16px; justify-content: space-between; }
  body.clean .bar { display: none; }
  body.idle .bar { opacity: 0; pointer-events: none; }

  .brand { font-weight: 600; margin-right: auto; }
  .pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 2px 10px;
    border-radius: 999px;
    border: 1px solid var(--border);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.live { background: var(--live); animation: pulse 1.6s infinite; }
  .dot.ok { background: var(--ok); }
  .dot.warn { background: var(--warn); }
  @keyframes pulse { 50% { opacity: 0.35; } }

  button, a.button {
    font: inherit;
    color: var(--fg);
    background: transparent;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 6px 12px;
    cursor: pointer;
    text-decoration: none;
  }
  button:hover, a.button:hover { border-color: var(--accent); color: var(--accent); }
  button.on { border-color: var(--live); color: var(--live); }
  button[hidden] { display: none; }
  .hint { color: var(--muted); font-size: 12px; }
  code { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 12px; }

  #photoToast {
    position: fixed;
    right: 16px;
    bottom: 76px;
    display: flex;
    gap: 10px;
    align-items: center;
    padding: 8px;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    color: var(--fg);
    text-decoration: none;
  }
  #photoToast[hidden] { display: none; }
  #record.on { border-color: var(--live); color: var(--live); font-variant-numeric: tabular-nums; }
  #recPill { color: var(--live); }
  #recPill[hidden] { display: none; }
  #photoToast img { width: 72px; height: 72px; object-fit: cover; border-radius: 8px; display: block; }
  body.clean #photoToast { display: none; }
</style>
</head>
<body>
<div id="stage">
  <img id="video" alt="Live view from the glasses">
  <div id="placeholder">
    <strong>Waiting for the glasses…</strong>
    Start streaming in the GlassCast app on your phone.
  </div>
</div>

<div id="top" class="bar">
  <span class="brand">GlassCast</span>
  <span class="pill"><span id="dot" class="dot"></span><span id="state">connecting</span></span>
  <span class="pill" id="fps">– fps</span>
  <span class="pill" id="res">–</span>
  <span class="pill" id="clients">– viewers</span>
  <span class="pill" id="recPill" hidden><span class="dot live"></span>REC</span>
</div>

<div id="bottom" class="bar">
  <span class="hint">OBS / VLC: <code id="streamUrl"></code> · sound: <code id="audioUrl"></code></span>
  <span>
    <button id="capture" type="button" hidden>Take photo</button>
    <button id="record" type="button" hidden>Record</button>
    <button id="sound" type="button" hidden>Sound off</button>
    <a class="button" id="snapshot" href="snapshot.jpg" download="glasscast.jpg">Snapshot</a>
    <button id="fullscreen" type="button">Fullscreen</button>
  </span>
</div>

<a id="photoToast" href="photo.jpg" target="_blank" hidden>
  <img id="photoThumb" alt="Newest photo from the glasses">
  <span>New photo<br><span class="hint">Click to open</span></span>
</a>

<script>
(() => {
  const params = new URLSearchParams(location.search);
  if (params.has('clean')) document.body.classList.add('clean');

  const video = document.getElementById('video');
  const placeholder = document.getElementById('placeholder');
  const $ = (id) => document.getElementById(id);
  const streamUrl = new URL('stream', location.href).href;
  $('streamUrl').textContent = streamUrl;
  $('audioUrl').textContent = new URL('audio', location.href).href;

  // The <img> keeps a single multipart/x-mixed-replace connection open. If it
  // drops (phone locked, Wi-Fi blip) we reconnect with a cache-busting query.
  let retryTimer = null;
  function connect() {
    clearTimeout(retryTimer);
    video.src = 'stream?t=' + Date.now();
  }
  video.addEventListener('load', () => { placeholder.hidden = true; });
  video.addEventListener('error', () => {
    placeholder.hidden = false;
    retryTimer = setTimeout(connect, 1000);
  });

  const labels = {
    streaming: ['live', 'live'],
    paused: ['paused', 'warn'],
    starting: ['starting', 'warn'],
    waitingForDevice: ['waiting for glasses', 'warn'],
    stopped: ['stopped', ''],
  };

  async function pollStatus() {
    try {
      const res = await fetch('status', { cache: 'no-store' });
      const s = await res.json();
      const [text, cls] = labels[s.state] || [s.state, ''];
      $('state').textContent = text;
      $('dot').className = 'dot ' + cls;
      $('fps').textContent = (s.fps || 0).toFixed(1) + ' fps';
      $('res').textContent = s.width ? s.width + '×' + s.height : '–';
      $('clients').textContent = s.clients + (s.clients === 1 ? ' viewer' : ' viewers');
      audio.setAvailable(!!s.audio);
      photos.update(s);
      recorder.update(s);
      // Reconnect the image as soon as the phone starts sending again.
      if (s.state === 'streaming' && !placeholder.hidden) connect();
    } catch (e) {
      $('state').textContent = 'phone unreachable';
      $('dot').className = 'dot';
    }
  }

  // Sound: the phone serves the glasses microphone at /audio as an endless 16-bit mono
  // WAV. We read it with fetch() and schedule it through Web Audio, which keeps latency
  // low and lets us skip ahead when we fall behind. Browsers only start audio after a
  // click, except OBS browser sources, where ?audio turns it on automatically.
  const audio = (() => {
    const button = $('sound');
    const maxLead = 0.4; // seconds of buffered audio before we drop and catch up
    let available = false;
    let wanted = params.has('audio');
    let ctx = null;
    let out = null; // all audio goes through here: speakers, plus the recorder when recording
    let controller = null;
    let retryTimer = null;

    function context() {
      if (!ctx) {
        ctx = new AudioContext();
        out = ctx.createGain();
        out.connect(ctx.destination);
      }
      return ctx;
    }

    function render() {
      button.hidden = !available;
      button.textContent = wanted ? 'Sound on' : 'Sound off';
      button.classList.toggle('on', wanted);
    }

    async function play() {
      if (controller || !available || !wanted) return;
      controller = new AbortController();
      try {
        const res = await fetch('audio?t=' + Date.now(), { cache: 'no-store', signal: controller.signal });
        if (!res.ok || !res.body) throw new Error('HTTP ' + res.status);
        const reader = res.body.getReader();
        let header = new Uint8Array(0);
        let rate = 0;
        let carry = null; // odd byte left over between chunks
        let next = 0;
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          let bytes = value;
          if (!rate) {
            header = concat(header, bytes);
            if (header.length < 44) continue;
            rate = new DataView(header.buffer).getUint32(24, true);
            bytes = header.subarray(44);
            context();
          }
          if (carry) { bytes = concat(carry, bytes); carry = null; }
          if (bytes.length % 2) { carry = bytes.slice(-1); bytes = bytes.subarray(0, bytes.length - 1); }
          if (!bytes.length) continue;
          const pcm = new Int16Array(bytes.buffer.slice(bytes.byteOffset, bytes.byteOffset + bytes.length));
          const buffer = ctx.createBuffer(1, pcm.length, rate);
          const channel = buffer.getChannelData(0);
          for (let i = 0; i < pcm.length; i++) channel[i] = pcm[i] / 32768;
          const source = ctx.createBufferSource();
          source.buffer = buffer;
          source.connect(out);
          const now = ctx.currentTime;
          if (next < now || next - now > maxLead) next = now + 0.05;
          source.start(next);
          next += buffer.duration;
        }
      } catch (e) {
        if (e.name === 'AbortError') return;
      } finally {
        controller = null;
      }
      // Dropped (phone locked, sound turned off on the phone): try again while still wanted.
      clearTimeout(retryTimer);
      retryTimer = setTimeout(play, 1000);
    }

    function stop() {
      clearTimeout(retryTimer);
      controller?.abort();
      controller = null;
    }

    function concat(a, b) {
      const out = new Uint8Array(a.length + b.length);
      out.set(a);
      out.set(b, a.length);
      return out;
    }

    button.addEventListener('click', () => {
      wanted = !wanted;
      if (wanted) {
        context().resume();
        play();
      } else {
        stop();
      }
      render();
    });

    return {
      /** A MediaStream carrying everything the viewer plays, for the recorder. */
      tap() {
        const node = context().createMediaStreamDestination();
        out.connect(node);
        ctx.resume();
        return { stream: node.stream, release: () => out.disconnect(node) };
      },
      isPlaying: () => wanted && available,
      setAvailable(value) {
        if (value === available) return;
        available = value;
        if (available) play();
        else stop();
        render();
      },
    };
  })();

  // Photos: "Take photo" asks the phone to have the glasses take a full photo (POST
  // /capture). When /status reports a new photo number, show it from /photo.jpg.
  const photos = (() => {
    const button = $('capture');
    const toast = $('photoToast');
    let seq = null;
    let hideTimer = null;
    let resetTimer = null;

    function ready() {
      clearTimeout(resetTimer);
      button.disabled = false;
      button.textContent = 'Take photo';
    }

    button.addEventListener('click', async () => {
      button.disabled = true;
      button.textContent = 'Taking photo…';
      // The phone gives up after 20 s; never leave the button stuck.
      resetTimer = setTimeout(ready, 25000);
      try {
        const res = await fetch('capture', { method: 'POST' });
        if (!res.ok) throw new Error(await res.text());
      } catch (e) {
        ready();
      }
    });

    return {
      update(s) {
        button.hidden = s.state !== 'streaming';
        const latest = s.photo || 0;
        if (seq !== null && latest > seq) {
          const url = 'photo.jpg?n=' + latest;
          $('photoThumb').src = url;
          toast.href = url;
          toast.hidden = false;
          clearTimeout(hideTimer);
          hideTimer = setTimeout(() => { toast.hidden = true; }, 8000);
          ready();
        }
        seq = latest;
      },
    };
  })();

  // Recording happens in this browser, so it works the same for iOS and Android phones:
  // frames from the <img> are painted onto a canvas, and the canvas plus the viewer's
  // audio (when sound is on) go into a MediaRecorder. Stopping downloads the file.
  const recorder = (() => {
    const button = $('record');
    const pill = $('recPill');
    const types = ['video/mp4;codecs=avc1,mp4a.40.2', 'video/mp4', 'video/webm;codecs=vp9,opus', 'video/webm'];
    const type = window.MediaRecorder ? types.find((t) => MediaRecorder.isTypeSupported(t)) : null;
    let rec = null;
    let audioTap = null;
    let started = 0;
    let tick = null;
    let paint = null;

    function start() {
      const canvas = document.createElement('canvas');
      canvas.width = video.naturalWidth || 504;
      canvas.height = video.naturalHeight || 896;
      const g = canvas.getContext('2d');
      paint = setInterval(() => {
        if (video.naturalWidth && (canvas.width !== video.naturalWidth || canvas.height !== video.naturalHeight)) {
          canvas.width = video.naturalWidth;
          canvas.height = video.naturalHeight;
        }
        g.drawImage(video, 0, 0, canvas.width, canvas.height);
      }, 1000 / 30);

      const stream = canvas.captureStream(30);
      if (audio.isPlaying()) {
        audioTap = audio.tap();
        audioTap.stream.getAudioTracks().forEach((t) => stream.addTrack(t));
      }
      const chunks = [];
      rec = new MediaRecorder(stream, { mimeType: type, videoBitsPerSecond: 5_000_000 });
      rec.ondataavailable = (e) => { if (e.data.size) chunks.push(e.data); };
      rec.onstop = () => {
        const blob = new Blob(chunks, { type: rec.mimeType });
        const ext = rec.mimeType.startsWith('video/mp4') ? 'mp4' : 'webm';
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'glasscast-' + new Date().toISOString().replace(/[:.]/g, '-').slice(0, 19) + '.' + ext;
        a.click();
        setTimeout(() => URL.revokeObjectURL(a.href), 10000);
        rec = null;
      };
      rec.start(1000);
      started = Date.now();
      tick = setInterval(render, 500);
      render();
    }

    function stop() {
      clearInterval(paint);
      clearInterval(tick);
      audioTap?.release();
      audioTap = null;
      rec?.stop();
      render();
    }

    function render() {
      const on = !!rec && rec.state === 'recording';
      pill.hidden = !on;
      button.classList.toggle('on', on);
      if (on) {
        const s = Math.floor((Date.now() - started) / 1000);
        button.textContent = 'Stop ' + Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
      } else {
        button.textContent = 'Record';
      }
    }

    button.addEventListener('click', () => (rec ? stop() : start()));

    return {
      update(s) {
        // Recording needs MediaRecorder; it keeps going through brief drops in the stream.
        button.hidden = !type || (s.state !== 'streaming' && !rec);
      },
    };
  })();

  $('fullscreen').addEventListener('click', () => {
    if (document.fullscreenElement) document.exitFullscreen();
    else document.documentElement.requestFullscreen?.();
  });

  // Hide the controls after a few seconds without mouse movement.
  let idleTimer = null;
  function wake() {
    document.body.classList.remove('idle');
    clearTimeout(idleTimer);
    idleTimer = setTimeout(() => document.body.classList.add('idle'), 3000);
  }
  ['mousemove', 'touchstart', 'keydown'].forEach((e) => addEventListener(e, wake, { passive: true }));

  connect();
  pollStatus();
  setInterval(pollStatus, 1000);
  wake();
})();
</script>
</body>
</html>
